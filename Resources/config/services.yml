services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    rtPiwikBundle\:
        resource: '../../{Command,Controller,Services}/'

    rtPiwikBundle\Services\Analytics: ~

    rtPiwikBundle\Services\MetricsService:
        arguments:
            $analytics: '@rtPiwikBundle\Services\Analytics'

    rtPiwikBundle\Services\TotalMetrics:
        arguments:
            $metricsService: '@rtPiwikBundle\Services\MetricsService'

    rtPiwikBundle\Services\LastDayMetrics:
        arguments:
            $metricsService: '@rtPiwikBundle\Services\MetricsService'

    rtPiwikBundle\Services\LastWeekMetrics:
        arguments:
            $metricsService: '@rtPiwikBundle\Services\MetricsService'

    # Backwards compatibility aliases
    analytics_service: '@rtPiwikBundle\Services\Analytics'
    metrics_service: '@rtPiwikBundle\Services\MetricsService'
    total_metrics: '@rtPiwikBundle\Services\TotalMetrics'
    last_day_metrics: '@rtPiwikBundle\Services\LastDayMetrics'
    last_week_metrics: '@rtPiwikBundle\Services\LastWeekMetrics'
